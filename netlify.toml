[build]
publish = "_site"
command = "./build-website.sh"
ignore = "./netlify-should-run.sh"

[[headers]]
  # All not latest documentation.
  for = "/docs/envoy/v*"
  [headers.values]
    # https://support.google.com/webmasters/answer/93710?hl=en
    # Do not index.
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self';"

[build.environment]
  YARN_VERSION = "1.22.10"
  NODE_OPTIONS="--max-old-space-size=8192"
  BAZELISK_HOME="/opt/build/cache/bazelisk"

[context.production.environment]
  JEKYLL_ENV = "production"

[context.branch-deploy.environment]
  JEKYLL_ENV = "staging"

[context.deploy-preview.environment]
  JEKYLL_ENV = "staging"

# Redirect to Slack invite link.
[[redirects]]
from = "/slack"
to = "https://join.slack.com/t/envoyproxy/shared_invite/zt-1fuxyzagj-jfO6OXk0zKOmIW35XkanXw"
status = 302

# Envoy docs requests are handled by an edge function. Latest docs are served
# by Netlify static hosting and decorated there, while archived docs are
# proxied from GCS. GCS does not map directory requests to index.html on
# storage.googleapis.com, so a plain proxy redirect would 404 every
# directory-shaped URL; the function normalises paths before proxying. The
# function also reproduces Netlify's "Pretty URLs" post-processing (stripping
# `.html` from Sphinx's generated links) that the archive relied on when it
# was previously hosted on Netlify. Route and caching config live in
# `netlify/edge-functions/docs-archive.ts`.

headline: >-
  <span class="kicker"><strong>One engine</strong> <em>for</em></span>
  <span class="terms"><span class="accent">cloud-native</span> <em>and</em>
  <span class="accent">AI-native</span></span>
  <span class="apps">applications</span>
intro: >-
  Envoy is the engine behind modern infrastructure — the same battle-tested performance,
  reliability, and observability powering microservices, edge, and AI workloads alike.
  And Envoy is going <strong>AI-native</strong>: from streaming LLM responses to agentic
  workloads, AI traffic is first-class in Envoy, right alongside everything else you run.
pillars:
- name: AI-native
  highlight: true
  description: >-
    Every hop of an AI system is traffic Envoy understands: clients streaming LLM responses,
    agents calling models and tools, agents talking to agents. Streaming-first protocols,
    long-lived connections, and load balancing tuned for expensive inference backends —
    AI traffic is production traffic in Envoy.
- name: Extensible
  description: >-
    Add your own logic to the data path with Wasm, Lua, Go, or Rust-powered dynamic modules,
    or out-of-process external processing — from auth to AI guardrails, no fork required.
- name: Observable
  description: >-
    Deep L7 visibility with consistent stats, access logs, and native distributed tracing
    across every service — when all traffic flows through Envoy, problem areas surface
    immediately.
- name: Runtime programmable
  description: >-
    Reconfigure routing, clusters, and policy on the fly through Envoy's dynamic xDS
    configuration APIs — no restarts, no dropped connections.
- name: Secure
  description: >-
    TLS termination and origination, mutual TLS, and SNI, plus a rich filter set including
    JWT authentication, RBAC, and external authorization.
- name: Built to build on
  description: >-
    The proven engine under gateways, service meshes, and platforms — Envoy Gateway,
    Envoy AI Gateway, and many more are powered by Envoy.

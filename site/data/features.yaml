- name: Out of process architecture
  description: |
    Envoy is a self contained, high performance server with a small memory footprint. It runs alongside
    any application language or framework.

- name: AI and LLM traffic management
  description: |
    Streaming-first handling of LLM and inference traffic. With Envoy AI Gateway on Kubernetes, get a
    unified API across GenAI providers, token-aware rate limiting, and provider fallback.

- name: HTTP/2, HTTP/3 and gRPC support
  description: |
    Envoy has first class support for HTTP/2, HTTP/3 and gRPC for both incoming and outgoing connections. It is a
    transparent HTTP/1.1 to HTTP/2 proxy.

- name: Advanced load balancing
  description: |
    Envoy supports advanced load balancing features including automatic retries, circuit breaking, global rate
    limiting, request shadowing, zone local load balancing, etc.

- name: Deep extensibility
  description: |
    Extend Envoy with Wasm, Lua, Go, Rust-powered dynamic modules, or out-of-process external
    processing — add custom logic to the data path, from auth to AI guardrails, without forking the proxy.

- name: APIs for configuration management
  description: |
    Envoy provides robust APIs for dynamically managing its configuration.

- name: Observability
  description: |
    Deep observability of L7 traffic, native support for distributed tracing, and wire-level observability of
    MongoDB, DynamoDB, and more.

- name: Security and TLS
  description: |
    Envoy provides TLS termination and origination, mutual TLS, SNI, and a rich set of security filters
    including JWT authentication, RBAC, and external authorization.

headline: The new era — Envoy is going <span class="ai-era-accent">AI-native</span>
intro: >-
  Envoy Core is moving to AI-native for the new era. The proxy that carried the cloud-native
  revolution is now carrying the industry's AI traffic — from streaming LLM responses to
  agentic workloads — with the same battle-tested performance, reliability, and observability
  at its core.
pillars:
- name: An AI-native core
  description: >-
    AI workloads are streaming, long-lived, and expensive — and Envoy's core is built for
    exactly that. First-class gRPC, server-sent events, and WebSocket support, with retries,
    timeouts, and load balancing that treat inference backends as the critical production
    traffic they are.
- name: Envoy AI Gateway
  description: >-
    Part of the Envoy project, Envoy AI Gateway builds on Envoy Gateway to bring GenAI traffic
    management to Kubernetes — a unified API in front of GenAI services, with token-aware rate
    limiting, provider fallback, and centralized credential management across LLM providers.
- name: Extensible to the core
  description: >-
    Shape AI traffic with your own logic in the data path. Extend Envoy with Wasm, Lua, Go, or
    Rust-powered dynamic modules, or attach out-of-process services via external processing —
    guardrails, prompt inspection, and custom policy, no fork required.
